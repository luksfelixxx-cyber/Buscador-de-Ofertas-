<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ofertas SC</title>
<meta name="theme-color" content="#193a50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ofertas SC">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --navy:#193a50; --navy-2:#24506d; --navy-soft:#e8eef3;
  --red:#d83038; --red-soft:#fbe9ea;
  --blue:#1f5fd6; --blue-soft:#e8f0fd;
  --green:#2e8b3e; --green-soft:#e6f4e8;
  --amber:#b86e00; --amber-soft:#fdf2e1;
  --ink:#1c2630; --muted:#66727e; --line:#e3e8ec; --bg:#f3f5f7; --card:#fff;
  --radius:12px; --shadow:0 1px 2px rgba(16,40,60,.06),0 2px 8px rgba(16,40,60,.05);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.hide{display:none!important}

/* ---------- Topo ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:7px;background:#fff;display:grid;place-items:center}
.brand-mark svg{width:20px;height:20px}
.brand small{display:block;font-weight:400;font-size:11.5px;opacity:.75;margin-top:-2px}
.tabs{display:flex;gap:2px;margin-left:12px}
.tab{padding:8px 14px;border-radius:8px;color:#cfdbe5;font-weight:600;font-size:14px;position:relative}
.tab:hover{background:rgba(255,255,255,.08);color:#fff}
.tab.on{background:#fff;color:var(--navy)}
.tab .bdg{margin-left:6px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip-data{font-size:12.5px;background:rgba(255,255,255,.12);padding:5px 10px;border-radius:20px;white-space:nowrap}
.icon-btn{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#fff}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.menu{position:absolute;right:12px;top:52px;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);min-width:210px;padding:6px;z-index:30}
.menu button{display:flex;width:100%;padding:10px 12px;border-radius:7px;text-align:left;gap:10px;align-items:center}
.menu button:hover{background:var(--bg)}
.bdg{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700}

/* ---------- Layout ---------- */
main{max-width:1180px;margin:0 auto;padding:18px 16px 110px}
.h1{font-size:20px;font-weight:700;margin:4px 0 14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.muted{color:var(--muted)}
.sp{height:14px}

/* ---------- Resumo ---------- */
.resumo{background:var(--navy);color:#fff;border-radius:var(--radius);overflow:hidden;padding:18px 20px;margin-bottom:16px}
.resumo h2{font-size:13px;font-weight:600;opacity:.75;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.resumo .frase{font-size:15px;line-height:1.6}
.resumo .frase b{font-size:17px}
.resumo .dest{grid-template-columns:minmax(0,1fr)}
.resumo .dest .pr{flex:none}
.resumo .dest .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.resumo .dest{margin-top:14px;border-top:1px solid rgba(255,255,255,.15);padding-top:12px;display:grid;gap:6px}
.resumo .dest-t{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.resumo .dest button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;color:#fff;padding:6px 8px;margin:0 -8px;border-radius:7px}
.resumo .dest button:hover{background:rgba(255,255,255,.08)}
.resumo .dest .pr{white-space:nowrap;font-weight:700}
.resumo .dest .pr em{font-style:normal;background:var(--red);border-radius:5px;padding:1px 6px;margin-left:6px;font-size:12px}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);color:#6b4200;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13.5px}
.resumo .aviso{background:rgba(255,190,90,.16);color:#ffe2b0}

/* ---------- Tipos e filtros ---------- */
.seg{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:8px 14px;border-radius:22px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg button span{opacity:.7;font-weight:500;margin-left:4px}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sel-f{height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 10px;min-width:0;flex:1 1 200px;max-width:320px}
.tgl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.tgl input{width:18px;height:18px;accent-color:var(--navy)}

/* ---------- Lista de produtos ---------- */
.lista{overflow:hidden}
.prod{display:grid;grid-template-columns:40px 1fr auto 40px;gap:4px 10px;align-items:center;padding:11px 10px 11px 6px;border-top:1px solid var(--line)}
.prod:first-child{border-top:0}
.prod.marcado{background:#f4f8ff}
.prod .nome{font-weight:600;font-size:14.5px;line-height:1.3;word-break:break-word}
.prod .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}
.t-menor{background:var(--blue-soft);color:var(--blue)}
.t-queda{background:var(--red-soft);color:var(--red)}
.t-voltou{background:var(--green-soft);color:var(--green)}
.t-novo{background:var(--amber-soft);color:var(--amber)}
.t-of{background:var(--navy-soft);color:var(--navy)}
.t-zero{background:#f0f0f0;color:#888}
.preco{text-align:right;white-space:nowrap}
.preco .nf{font-size:17px;font-weight:700;color:var(--navy)}
.preco .era{font-size:12px;color:var(--muted)}
.preco .era s{margin-left:3px}
.preco .eco{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;color:#fff;background:var(--red);border-radius:5px;padding:1px 6px}
.preco .cmp{font-size:12px;color:var(--muted);line-height:1.5}
.preco .cmp b{color:var(--ink)}
.ck{width:30px;height:30px;border-radius:8px;border:2px solid #c7d0d8;display:grid;place-items:center;margin-left:4px;color:transparent;background:#fff}
.ck:hover{border-color:var(--navy)}
.ck.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ck svg,.star svg{width:18px;height:18px}
.star{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#c2cbd3}
.star:hover{background:var(--bg)}
.star.on{color:#f0a400}
.mais{display:block;width:100%;padding:13px;color:var(--blue);font-weight:600;border-top:1px solid var(--line)}
.vazio{padding:38px 20px;text-align:center;color:var(--muted)}
.vazio b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.carregando{padding:30px;text-align:center;color:var(--muted)}

/* ---------- Busca ---------- */
.busca{position:relative;margin-bottom:14px}
.busca input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 16px 0 46px;font-size:16px;box-shadow:var(--shadow)}
.busca input:focus{outline:2px solid var(--navy);outline-offset:-1px}
.busca svg{position:absolute;left:15px;top:15px;width:20px;height:20px;color:var(--muted)}

/* ---------- Lista WhatsApp ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
.sec-t small{font-weight:500;color:var(--muted)}
.lnk{color:var(--blue);font-weight:600;font-size:13.5px}
.lnk.red{color:var(--red)}
.campo{padding:14px 16px}
.campo label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.campo input,.campo textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}
.campo textarea{min-height:340px;font:13.5px/1.45 ui-monospace,Consolas,monospace;resize:vertical}
.acoes{display:flex;gap:10px;padding:0 16px 16px;flex-wrap:wrap}
.btn{height:44px;padding:0 18px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1}
.btn svg{width:18px;height:18px}
.btn-p{background:var(--navy);color:#fff}
.btn-w{background:#1fa855;color:#fff}
.btn-g{background:#fff;border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.rm{width:32px;height:32px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.rm:hover{background:var(--red-soft);color:var(--red)}
.hist{padding:12px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.hist:first-of-type{border-top:0}
.hist .q{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .bt{display:flex;gap:12px}

/* ---------- Importar ---------- */
.drop{display:block;border:2px dashed #b9c6d1;border-radius:var(--radius);background:#fff;padding:34px 20px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--navy);background:var(--navy-soft)}
.drop svg{display:block;margin:0 auto 8px;width:38px;height:38px;color:var(--navy)}
.drop b{display:block;font-size:16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-weight:600;font-size:13px}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl input[type=date]{border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.st-ok{color:var(--green);font-weight:600}.st-err{color:var(--red);font-weight:600}.st-w{color:var(--amber);font-size:12.5px}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--navy);width:0;transition:width .2s}
.tbl-wrap{overflow-x:auto}

/* ---------- Barra inferior / flutuante ---------- */
.bottom{display:none}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:15;background:var(--navy);color:#fff;border-radius:30px;padding:12px 20px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(16,40,60,.3);font-weight:600;white-space:nowrap}
.fab button{color:#fff;background:var(--red);border-radius:20px;padding:6px 14px;font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#22303c;color:#fff;padding:11px 18px;border-radius:10px;z-index:50;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

/* ---------- Login / Config ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--navy)}
.auth .card{width:100%;max-width:380px;padding:26px}
.auth h1{font-size:20px;margin:14px 0 4px}
.auth p{color:var(--muted);font-size:14px;margin-bottom:16px}
.auth label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.auth input{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;padding:0 12px}
.auth .btn{width:100%;margin-top:18px}
.auth .err{color:var(--red);font-size:13.5px;margin-top:10px}

/* ---------- Celular ---------- */
@media (max-width:760px){
  .tabs,.chip-data .lg{display:none}
  .top-in{padding:8px 12px;min-height:52px}
  main{padding:14px 12px calc(96px + var(--safe-b))}
  .bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
  .bottom button{padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
  .bottom button svg{width:23px;height:23px}
  .bottom button.on{color:var(--navy)}
  .bottom .bdg{position:absolute;top:3px;left:calc(50% + 6px)}
  .fab{bottom:calc(72px + var(--safe-b))}
  .toast{bottom:calc(136px + var(--safe-b))}
  .grid2{grid-template-columns:1fr}
  .lista .prod{grid-template-columns:34px 1fr auto;padding:11px 10px 11px 4px;align-items:start}
  .lista .prod .ck{grid-column:1;grid-row:1;margin-top:2px}
  .lista .prod .star{grid-column:1;grid-row:2;justify-self:center;width:30px;height:30px}
  .lista .prod>div:nth-of-type(1){grid-column:2;grid-row:1/span 2}
  .lista .prod .preco{grid-column:3;grid-row:1/span 2}
  .meta .ean{display:none}
  .preco .nf{font-size:16px}
  .sel-f{max-width:none;flex:1 1 140px}
  .resumo{padding:16px}
  .so-pc{display:none!important}
}
@media (min-width:761px){.so-cel{display:none!important}}
</style>

<body>
<div id="app"></div>

<!-- Supabase (banco + login) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   CONFIGURAÇÃO DO SUPABASE
   Preencha aqui (Project URL e anon public key) OU deixe vazio:
   o app pede esses dados na primeira vez e guarda no aparelho.
   ===================================================================== */
const SUPABASE_URL = '';
const SUPABASE_KEY = '';
const XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
</script>

<script>
/* ===== LEITOR DA PLANILHA DO PEDIDO ELETRÔNICO =====
   Entrada: workbook do SheetJS. Saída: { data, farmacia, produtos[], ofertas[], precos[] }
   Aceita a exportação da "Lista de Produtos" (Relatório Produto). */
const Planilha = (() => {
  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]/g, '');

  // Colunas reconhecidas (nome normalizado -> campo)
  const COLS = {
    santacruz: 'cod', codigoean: 'ean', ean: 'ean', descricao: 'desc', laboratorio: 'lab',
    precofabrica: 'pf', desccom: 'dc', oferta: 'oferta', categoria: 'cat', preconf: 'nf', estoque: 'est', descricaooferta: 'odesc', dataniciooferta: 'oini',
    datainiciooferta: 'oini', datafimoferta: 'ofim'
  };

  const num = v => {
    if (v === null || v === undefined || v === '' || v === '-') return null;
    if (typeof v === 'number') return v;
    let s = String(v).replace(/R\$|%|\s/g, '');
    if (s === '' || s === '-') return null;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  };

  // "31/12/2026" -> "2026-12-31"
  const dataBR = v => {
    if (v === null || v === undefined || v === '' || v === '-') return null;
    if (v instanceof Date) return isoLocal(v);
    const m = String(v).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : null;
  };

  const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  const txt = v => {
    if (v === null || v === undefined) return null;
    const s = String(v).trim();
    return s === '' || s === '-' ? null : s;
  };

  // Data do retrato: data de criação gravada no arquivo, senão data do nome, senão data do arquivo
  function dataDoArquivo(wb, nome, lastModified) {
    const p = wb.Props || {};
    const c = p.CreatedDate || p.ModifiedDate;
    if (c) { const d = new Date(c); if (!isNaN(d)) return { data: isoLocal(d), origem: 'arquivo' }; }
    const m = String(nome || '').match(/(\d{2})[-_.](\d{2})[-_.](\d{4})/);
    if (m) return { data: `${m[3]}-${m[2]}-${m[1]}`, origem: 'nome' };
    if (lastModified) return { data: isoLocal(new Date(lastModified)), origem: 'modificacao' };
    return { data: isoLocal(new Date()), origem: 'hoje' };
  }

  function ler(wb, nome, lastModified) {
    const ws = wb.Sheets[wb.SheetNames[0]];
    const linhas = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });

    let farmacia = null, hi = -1;
    for (let i = 0; i < Math.min(linhas.length, 30); i++) {
      const r = linhas[i] || [];
      if (norm(r[0]) === 'farmacia' && r[1]) farmacia = String(r[1]).trim();
      if (r.some(c => norm(c) === 'codigoean')) { hi = i; break; }
    }
    if (hi < 0) throw new Error('Não encontrei a coluna "Código EAN". Exporte pela aba Lista de Produtos do pedido eletrônico.');

    const idx = {};
    linhas[hi].forEach((c, i) => { const f = COLS[norm(c)]; if (f && idx[f] === undefined) idx[f] = i; });
    for (const f of ['ean', 'desc', 'nf']) {
      if (idx[f] === undefined) throw new Error(`Coluna obrigatória ausente: ${{ ean: 'Código EAN', desc: 'Descrição', nf: 'Preço NF' }[f]}`);
    }
    const g = (r, f) => idx[f] === undefined ? null : r[idx[f]];

    const produtos = [], precos = [], ofertas = new Map(), vistos = new Set();
    for (let i = hi + 1; i < linhas.length; i++) {
      const r = linhas[i];
      let ean = txt(g(r, 'ean'));
      if (!ean) continue;
      ean = ean.replace(/\D/g, '');
      if (!ean || vistos.has(ean)) continue;
      vistos.add(ean);
      const desc = txt(g(r, 'desc')) || '';
      const oferta = txt(g(r, 'oferta'));
      produtos.push({ ean, cod: txt(g(r, 'cod')), descricao: desc, laboratorio: txt(g(r, 'lab')), categoria: txt(g(r, 'cat')) });
      precos.push({ ean, pf: num(g(r, 'pf')), nf: num(g(r, 'nf')), desconto: num(g(r, 'dc')), estoque: Math.round(num(g(r, 'est')) ?? 0), oferta });
      if (oferta && !ofertas.has(oferta)) {
        ofertas.set(oferta, { id: oferta, descricao: txt(g(r, 'odesc')), inicio: dataBR(g(r, 'oini')), fim: dataBR(g(r, 'ofim')) });
      }
    }
    if (!produtos.length) throw new Error('A planilha não tem produtos.');
    const d = dataDoArquivo(wb, nome, lastModified);
    return { data: d.data, origemData: d.origem, farmacia, arquivo: nome || null, produtos, precos, ofertas: [...ofertas.values()] };
  }

  return { ler, num, dataBR };
})();
</script>
<script>
/* ===== IMPORTADOR: grava um retrato diário no banco =====
   api = { rpc(fn,args), upsert(tabela, linhas, conflito, ignorarExistentes) }
   Envia em lotes para não estourar limite de requisição. */
const Importador = (() => {
  const LOTE = 1000;
  async function emLotes(linhas, fn, progresso, base, peso) {
    for (let i = 0; i < linhas.length; i += LOTE) {
      await fn(linhas.slice(i, i + LOTE));
      progresso && progresso(base + peso * Math.min(1, (i + LOTE) / linhas.length));
    }
  }
  async function importar(api, r, { maisRecente = true, progresso } = {}) {
    progresso && progresso(0.02);
    await api.rpc('preparar_importacao', { p_data: r.data });
    // Cadastro: só sobrescreve descrição/lab se a planilha for a mais recente
    await emLotes(r.produtos, l => api.upsert('produtos', l.map(p => ({ ...p, atualizado_em: new Date().toISOString() })), 'ean', !maisRecente), progresso, 0.02, 0.38);
    if (r.ofertas.length) await emLotes(r.ofertas, l => api.upsert('ofertas', l, 'id', !maisRecente), null);
    await emLotes(r.precos, l => api.upsert('precos', l.map(p => ({ data: r.data, ...p })), 'data,ean', false), progresso, 0.4, 0.5);
    const res = await api.rpc('finalizar_importacao', { p_data: r.data, p_farmacia: r.farmacia, p_arquivo: r.arquivo });
    progresso && progresso(1);
    return res;
  }
  return { importar };
})();
</script>

<script>
/* =====================================================================
   APP
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = v => v == null ? '—' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const pct = v => v == null ? '' : `-${Number(v).toLocaleString('pt-BR', { maximumFractionDigits: v >= 10 ? 0 : 1 })}%`;
const dBR = (iso, ano) => { if (!iso) return '—'; const [y, m, d] = String(iso).slice(0, 10).split('-'); return ano ? `${d}/${m}/${y}` : `${d}/${m}`; };
const ls = {
  get(k, def) { try { const v = localStorage.getItem('ofsc_' + k); return v == null ? def : JSON.parse(v); } catch { return def; } },
  set(k, v) { try { localStorage.setItem('ofsc_' + k, JSON.stringify(v)); } catch {} }
};

const IC = {
  hoje: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
  busca: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>',
  starO: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>',
  lista: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-5 5m5-5 5 5M4 20h16"/></svg>',
  dots: '<svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="18" height="18"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>',
  logo: '<svg viewBox="0 0 20 20"><rect x="7" y="1.5" width="6" height="17" rx="1" fill="#d83038"/><rect x="1.5" y="7" width="17" height="6" rx="1" fill="#d83038"/></svg>'
};

/* ---------- Estado ---------- */
const S = {
  api: null, sb: null,
  aba: 'hoje', tipo: 'menor30', lab: '', cat: '', estoque: true, limite: 300,
  painel: null, itens: null, carregando: false,
  busca: '', resBusca: null,
  vigiados: null,
  lista: ls.get('lista', []),            // itens escolhidos para o WhatsApp
  intro: ls.get('intro', 'Bom dia, time! Oportunidades de hoje na Santa Cruz:'),
  texto: null, textoEditado: false,
  historico: null,
  fila: [],                              // planilhas aguardando importação
  dias: null, importando: false
};
const ehCel = () => matchMedia('(max-width:760px)').matches;

/* ---------- Acesso ao banco ---------- */
function apiSupabase(sb) {
  const chk = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
  return {
    rpc: async (fn, args = {}) => chk(await sb.rpc(fn, args)),
    upsert: async (t, linhas, conflito, ignorar) => chk(await sb.from(t).upsert(linhas, { onConflict: conflito, ignoreDuplicates: !!ignorar })),
    inserir: async (t, linhas) => chk(await sb.from(t).insert(linhas)),
    apagar: async (t, campo, valor) => chk(await sb.from(t).delete().eq(campo, valor)),
    selecionar: async (t, ordem, limite) => { const [c, dir] = ordem.split(' '); return chk(await sb.from(t).select('*').order(c, { ascending: dir !== 'desc' }).limit(limite)); }
  };
}

async function iniciar() {
  if (window.__API_PROMISE__) { S.api = await window.__API_PROMISE__; return montar(); } // modo de teste
  const url = SUPABASE_URL || ls.get('url', ''), key = SUPABASE_KEY || ls.get('key', '');
  if (!url || !key) return telaConfig();
  try {
    S.sb = supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true } });
  } catch (e) { return telaConfig('Endereço inválido: ' + e.message); }
  const { data } = await S.sb.auth.getSession();
  if (!data.session) return telaLogin();
  S.api = apiSupabase(S.sb);
  montar();
}

function telaConfig(erro) {
  $('#app').innerHTML = `<div class="auth"><form class="card" id="fCfg">
    <div class="brand-mark" style="width:40px;height:40px">${IC.logo}</div>
    <h1>Conectar ao Supabase</h1>
    <p>Cole os dados do seu projeto (Project Settings › API). Fica salvo só neste aparelho.</p>
    <label>Project URL</label><input name="url" placeholder="https://xxxx.supabase.co" value="${esc(ls.get('url', ''))}" required>
    <label>anon public key</label><input name="key" placeholder="eyJ..." value="${esc(ls.get('key', ''))}" required>
    ${erro ? `<div class="err">${esc(erro)}</div>` : ''}
    <button class="btn btn-p">Salvar</button></form></div>`;
  $('#fCfg').onsubmit = e => {
    e.preventDefault(); const f = new FormData(e.target);
    ls.set('url', String(f.get('url')).trim().replace(/\/+$/, '')); ls.set('key', String(f.get('key')).trim());
    location.reload();
  };
}

function telaLogin(erro) {
  $('#app').innerHTML = `<div class="auth"><form class="card" id="fLogin">
    <div class="brand-mark" style="width:40px;height:40px">${IC.logo}</div>
    <h1>Ofertas SC</h1><p>Entre com seu e-mail e senha.</p>
    <label>E-mail</label><input name="email" type="email" autocomplete="username" required>
    <label>Senha</label><input name="senha" type="password" autocomplete="current-password" required>
    ${erro ? `<div class="err">${esc(erro)}</div>` : ''}
    <button class="btn btn-p">Entrar</button>
    <p style="margin:14px 0 0;text-align:center"><a href="#" class="lnk" id="trocarProj">Trocar projeto Supabase</a></p></form></div>`;
  $('#fLogin').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    const b = e.target.querySelector('.btn'); b.disabled = true; b.textContent = 'Entrando…';
    const { error } = await S.sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('senha') });
    if (error) return telaLogin(error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message);
    S.api = apiSupabase(S.sb); montar();
  };
  $('#trocarProj').onclick = e => { e.preventDefault(); ls.set('url', ''); ls.set('key', ''); location.reload(); };
}

/* ---------- Estrutura ---------- */
const ABAS = [['hoje', 'Ofertas', IC.hoje], ['busca', 'Busca', IC.busca], ['vigiados', 'Vigiados', IC.starO], ['lista', 'Lista', IC.lista]];

function montar() {
  $('#app').innerHTML = `
  <header class="top"><div class="top-in">
    <div class="brand"><div class="brand-mark">${IC.logo}</div><div>Ofertas<small>Pedido Eletrônico</small></div></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="top-right">
      <span class="chip-data" id="chipData"></span>
      <button class="icon-btn so-pc" data-go="importar" title="Importar planilhas">${IC.up}</button>
      <button class="icon-btn" id="btnMenu" title="Menu">${IC.dots}</button>
    </div>
    <div class="menu hide" id="menu">
      <button data-go="importar">${IC.up.replace('<svg', '<svg width="18" height="18"')} Importar planilhas</button>
      ${S.sb ? `<button id="sair">${IC.out} Sair</button>` : ''}
    </div>
  </div></header>
  <main id="main"></main>
  <nav class="bottom" id="bottom"></nav>
  <div id="fab"></div>`;
  $('#btnMenu').onclick = e => { e.stopPropagation(); $('#menu').classList.toggle('hide'); };
  document.addEventListener('click', () => $('#menu')?.classList.add('hide'));
  if ($('#sair')) $('#sair').onclick = async () => { await S.sb.auth.signOut(); location.reload(); };
  document.body.addEventListener('click', onClick);
  carregarPainel().then(() => { if (S.painel?.vazio) ir('importar'); });
  ir(S.aba);
}

function navs() {
  const n = S.lista.length;
  const b = k => k === 'lista' && n ? `<span class="bdg">${n}</span>` : '';
  $('#tabs').innerHTML = ABAS.map(([k, t]) => `<button class="tab ${S.aba === k ? 'on' : ''}" data-go="${k}">${t}${b(k)}</button>`).join('') +
    `<button class="tab ${S.aba === 'importar' ? 'on' : ''}" data-go="importar">Importar</button>`;
  $('#bottom').innerHTML = ABAS.map(([k, t, ic]) => `<button class="${S.aba === k ? 'on' : ''}" data-go="${k}">${ic}${t}${b(k)}</button>`).join('');
  const p = S.painel;
  $('#chipData').innerHTML = p && !p.vazio ? `<span class="lg">Preços de </span>${dBR(p.data, true)}` : '';
  fab();
}

function fab() {
  const n = S.lista.length;
  $('#fab').innerHTML = n && S.aba !== 'lista' && S.aba !== 'importar'
    ? `<div class="fab">${n} ${n === 1 ? 'item' : 'itens'} na lista <button data-go="lista">Montar</button></div>` : '';
}

function ir(aba) {
  S.aba = aba; navs(); window.scrollTo(0, 0);
  ({ hoje: vHoje, busca: vBusca, vigiados: vVigiados, lista: vLista, importar: vImportar })[aba]();
}

function toast(msg, ms = 2600) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
async function tentar(fn) {
  try { return await fn(); }
  catch (e) {
    console.error(e);
    if (/JWT|token/i.test(e.message) && S.sb) { toast('Sessão expirada. Entre novamente.'); return telaLogin(); }
    toast('Erro: ' + e.message, 5000);
  }
}

/* ---------- Dados ---------- */
async function carregarPainel() {
  await tentar(async () => { S.painel = await S.api.rpc('painel'); });
  navs();
  if (S.aba === 'hoje') vHoje();
}
async function carregarItens() {
  S.carregando = true; S.itens = null; desenharItens();
  await tentar(async () => {
    S.itens = await S.api.rpc('listar', { p_tipo: S.tipo, p_lab: S.lab || null, p_cat: S.cat || null, p_estoque: S.estoque, p_busca: null, p_limite: S.limite });
  });
  S.carregando = false; desenharItens();
}

/* ---------- Linha de produto ---------- */
const naLista = ean => S.lista.some(x => x.ean === ean);
function linha(it, modo) {
  const tags = [];
  if (it.menor30) tags.push('<span class="tag t-menor">Menor preço 30 dias</span>');
  if (it.queda) tags.push(`<span class="tag t-queda">Caiu desde ${dBR(S.painel?.data_ant)}</span>`);
  if (it.voltou) tags.push('<span class="tag t-voltou">Voltou ao estoque</span>');
  if (it.novo) tags.push('<span class="tag t-novo">Novo</span>');
  if (!(it.est > 0)) tags.push('<span class="tag t-zero">Sem estoque</span>');
  if (it.ofim) tags.push(`<span class="tag t-of">Oferta até ${dBR(it.ofim)}</span>`);

  let preco;
  if (modo === 'busca') {
    const menor = it.min30 == null ? null : Math.min(it.min30, it.nf);
    const cmp = !it.dias30 ? 'Sem histórico ainda' : it.nf <= it.min30 ? '<b>É o menor preço em 30 dias</b>' : `Menor 30 dias: <b>${brl(menor)}</b>`;
    preco = `<div class="nf">${brl(it.nf)}</div><div class="cmp">${cmp}</div>`;
  } else {
    preco = `<div class="nf">${brl(it.nf)}</div>${it.ref ? `<div class="era">era<s>${brl(it.ref)}</s></div><span class="eco">${pct(it.eco)}</span>` : ''}`;
  }
  const on = naLista(it.ean), vig = S.vigSet?.has(it.ean) ?? it.vig;
  return `<div class="prod ${on ? 'marcado' : ''}" data-ean="${esc(it.ean)}">
    <button class="ck ${on ? 'on' : ''}" data-act="sel" title="${on ? 'Tirar da lista' : 'Adicionar à lista do WhatsApp'}">${IC.check}</button>
    <div><div class="nome">${esc(it.desc)}</div>
      <div class="meta">${esc(it.lab || '')} · Cód. ${esc(it.cod || '—')}<span class="ean"> · EAN ${esc(it.ean)}</span></div>
      ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}</div>
    <div class="preco">${preco}</div>
    <button class="star ${vig ? 'on' : ''}" data-act="vig" title="${vig ? 'Deixar de vigiar' : 'Vigiar produto'}">${vig ? IC.star : IC.starO}</button>
  </div>`;
}
// guarda os itens exibidos para recuperar ao clicar
const memo = new Map();
const guardar = arr => (arr || []).forEach(i => memo.set(i.ean, i));

/* ---------- Tela: Ofertas do dia ---------- */
const TIPOS = [['menor30', 'Menor preço 30 dias'], ['quedas', 'Caíram'], ['voltou', 'Voltou ao estoque'], ['novos', 'Novos']];

function resumoHTML(p) {
  if (!p || p.vazio) return '';
  const c = p.cont, partes = [];
  let frase;
  if (!p.data_ant) frase = `Primeiro dia de histórico. A partir da próxima planilha o app compara os preços e aponta as ofertas.`;
  else {
    partes.push(`<b>${c.menor30}</b> no menor preço dos últimos 30 dias`);
    partes.push(`<b>${c.quedas}</b> mais baratos que em ${dBR(p.data_ant)}`);
    if (c.voltou) partes.push(`<b>${c.voltou}</b> voltaram ao estoque`);
    if (c.novos) partes.push(`<b>${c.novos}</b> ${c.novos === 1 ? 'novo' : 'novos'} na planilha`);
    frase = partes.join(' · ');
  }
  const vig = (p.vig_caiu || []);
  guardar(p.destaques); guardar(vig);
  const qtd = ehCel() ? 3 : 5;
  const dest = (arr, t) => arr.length ? `<div class="dest"><div class="dest-t">${t}</div>${arr.slice(0, qtd).map(i =>
    `<button data-act="add" data-ean="${esc(i.ean)}" title="Adicionar à lista"><span class="nm">${esc(i.desc)}</span><span class="pr">${brl(i.nf)}<em>${pct(i.eco)}</em></span></button>`).join('')}</div>` : '';
  const avisos = [];
  if (p.farmacia && p.farmacia_ant && p.farmacia !== p.farmacia_ant)
    avisos.push(`A planilha de hoje é de outro cliente (${esc(p.farmacia)}). Os preços podem não ser comparáveis com ${dBR(p.data_ant)}.`);
  else if (p.data_ant && p.dias_hist < 5)
    avisos.push(`Histórico com ${p.dias_hist} ${p.dias_hist === 1 ? 'dia' : 'dias'} até agora. A comparação de 30 dias fica mais precisa a cada planilha.`);
  return `<section class="resumo"><h2>Resumo de ${dBR(p.data, true)}</h2><p class="frase">${frase}</p>
    ${dest(vig, '⭐ Vigiados que caíram')}${dest(p.destaques || [], 'Destaques do dia')}
    ${avisos.map(a => `<div class="aviso">${a}</div>`).join('')}</section>`;
}

function vHoje() {
  const p = S.painel;
  if (!p) return $('#main').innerHTML = '<div class="carregando">Carregando…</div>';
  if (p.vazio) return $('#main').innerHTML = `<div class="card vazio"><b>Nenhuma planilha importada</b>Importe a planilha do pedido eletrônico pelo computador.<div class="sp"></div><button class="btn btn-p" style="flex:none" data-go="importar">${IC.up} Importar planilhas</button></div>`;
  const c = p.cont;
  $('#main').innerHTML = `${resumoHTML(p)}
    <div class="seg" id="seg">${TIPOS.map(([k, t]) => `<button class="${S.tipo === k ? 'on' : ''}" data-tipo="${k}">${t}<span>${c[k] ?? 0}</span></button>`).join('')}</div>
    <div class="filtros">
      <select class="sel-f" id="fLab"><option value="">Todos os laboratórios</option>${(p.labs || []).map(l => `<option ${S.lab === l ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
      <select class="sel-f" id="fCat"><option value="">Todas as categorias</option>${(p.cats || []).map(l => `<option ${S.cat === l ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
      <label class="tgl"><input type="checkbox" id="fEst" ${S.estoque ? 'checked' : ''}> Só com estoque</label>
    </div>
    <div class="card lista" id="itens"></div>`;
  $('#fLab').onchange = e => { S.lab = e.target.value; S.limite = 300; carregarItens(); };
  $('#fCat').onchange = e => { S.cat = e.target.value; S.limite = 300; carregarItens(); };
  $('#fEst').onchange = e => { S.estoque = e.target.checked; S.limite = 300; carregarItens(); };
  carregarItens();
}

function desenharItens() {
  const el = $('#itens'); if (!el) return;
  if (S.carregando && !S.itens) return el.innerHTML = '<div class="carregando">Carregando…</div>';
  const arr = S.itens || [];
  guardar(arr);
  if (!arr.length) {
    const sem = !S.painel?.data_ant;
    el.innerHTML = `<div class="vazio"><b>${sem ? 'Ainda sem comparação' : 'Nada por aqui'}</b>${sem ? 'Importe a planilha de outro dia para o app encontrar as ofertas.' : 'Nenhum produto nesta categoria com os filtros escolhidos.'}</div>`;
    return;
  }
  el.innerHTML = arr.map(i => linha(i)).join('') +
    (arr.length >= S.limite ? `<button class="mais" data-act="mais">Ver mais</button>` : '');
}

/* ---------- Tela: Busca ---------- */
let tBusca;
function vBusca() {
  $('#main').innerHTML = `<div class="busca">${IC.busca}<input id="q" type="search" placeholder="Nome, EAN ou código Santa Cruz" value="${esc(S.busca)}" autocomplete="off"></div>
    <div class="card lista" id="resB"></div>`;
  const q = $('#q');
  q.oninput = () => { clearTimeout(tBusca); tBusca = setTimeout(() => buscar(q.value), 280); };
  if (!ehCel()) q.focus();
  desenharBusca();
}
async function buscar(v) {
  S.busca = v.trim();
  if (S.busca.length < 2) { S.resBusca = null; return desenharBusca(); }
  const alvo = S.busca;
  const r = await tentar(() => S.api.rpc('listar', { p_tipo: 'busca', p_lab: null, p_cat: null, p_estoque: false, p_busca: alvo, p_limite: 60 }));
  if (alvo !== S.busca) return;
  S.resBusca = r || []; desenharBusca();
}
function desenharBusca() {
  const el = $('#resB'); if (!el) return;
  if (!S.resBusca) return el.innerHTML = '<div class="vazio"><b>Buscar produto</b>Veja o preço de hoje e o menor preço dos últimos 30 dias.</div>';
  guardar(S.resBusca);
  el.innerHTML = S.resBusca.length ? S.resBusca.map(i => linha(i, 'busca')).join('') : '<div class="vazio"><b>Nada encontrado</b>Tente outra palavra, o EAN ou o código Santa Cruz.</div>';
}

/* ---------- Tela: Vigiados ---------- */
async function vVigiados() {
  $('#main').innerHTML = `<div class="h1">Vigiados</div><div class="card lista" id="resV"><div class="carregando">Carregando…</div></div>`;
  const r = await tentar(() => S.api.rpc('listar', { p_tipo: 'vigiados', p_lab: null, p_cat: null, p_estoque: false, p_busca: null, p_limite: 1000 }));
  S.vigiados = r || []; guardar(S.vigiados);
  S.vigSet = new Set(S.vigiados.map(i => i.ean));
  const caiu = S.vigiados.filter(i => i.menor30 || i.queda).sort((a, b) => (b.eco || 0) - (a.eco || 0));
  const resto = S.vigiados.filter(i => !(i.menor30 || i.queda));
  const el = $('#resV'); if (!el) return;
  el.innerHTML = S.vigiados.length ? [...caiu, ...resto].map(i => linha(i, i.menor30 || i.queda ? null : 'busca')).join('')
    : `<div class="vazio"><b>Nenhum produto vigiado</b>Toque na estrela ${IC.starO.replace('<svg', '<svg width="15" height="15" style="vertical-align:-2px"')} de qualquer produto. Quando ele cair de preço, aparece aqui em destaque e no resumo do dia.</div>`;
}

async function alternarVigia(ean) {
  if (!S.vigSet) S.vigSet = new Set(S.vigiados ? S.vigiados.map(i => i.ean) : []);
  const it = memo.get(ean);
  const ja = S.vigSet.has(ean) || (!S.vigiados && it?.vig);
  await tentar(async () => {
    if (ja) { await S.api.apagar('vigiados', 'ean', ean); S.vigSet.delete(ean); }
    else { await S.api.upsert('vigiados', [{ ean }], 'ean'); S.vigSet.add(ean); }
    if (it) it.vig = !ja;
    toast(ja ? 'Deixou de vigiar' : 'Produto vigiado ⭐');
    document.querySelectorAll(`.prod[data-ean="${ean}"] .star`).forEach(b => { b.classList.toggle('on', !ja); b.innerHTML = !ja ? IC.star : IC.starO; });
    S.painel = await S.api.rpc('painel');
    if (S.aba === 'vigiados') vVigiados();
  });
}

/* ---------- Seleção para a lista ---------- */
function alternarLista(ean, forcarAdd) {
  const i = S.lista.findIndex(x => x.ean === ean);
  if (i >= 0 && !forcarAdd) S.lista.splice(i, 1);
  else if (i < 0) { const it = memo.get(ean); if (!it) return; S.lista.push({ ...it, data: S.painel?.data }); }
  else return toast('Já está na lista');
  ls.set('lista', S.lista); S.textoEditado = false; S.texto = null;
  document.querySelectorAll(`.prod[data-ean="${ean}"]`).forEach(r => { const on = naLista(ean); r.classList.toggle('marcado', on); r.querySelector('.ck')?.classList.toggle('on', on); });
  if (forcarAdd) toast('Adicionado à lista');
  navs();
}

/* ---------- Tela: Lista WhatsApp ---------- */
function gerarTexto() {
  const d = S.painel?.data ? dBR(S.painel.data, true) : '';
  const linhas = [`*${S.intro.trim()}*`, d ? `_Preços de ${d}_` : '', ''];
  S.lista.forEach(i => {
    linhas.push(`▪️ *${i.desc}*`);
    const era = i.ref ? ` ~${brl(i.ref)}~ (${pct(i.eco)})` : '';
    linhas.push(`${brl(i.nf)}${era}`);
    const extra = [i.lab, i.ofim ? `oferta até ${dBR(i.ofim)}` : ''].filter(Boolean).join(' · ');
    if (extra) linhas.push(`_${extra}_`);
    linhas.push('');
  });
  return linhas.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

async function vLista() {
  if (!S.textoEditado || S.texto == null) S.texto = gerarTexto();
  const n = S.lista.length;
  $('#main').innerHTML = `<div class="grid2">
    <div class="card">
      <div class="sec-t">Itens escolhidos <small>${n} ${n === 1 ? 'item' : 'itens'}</small>${n ? '<button class="lnk red" data-act="limpar">Limpar</button>' : ''}</div>
      <div id="itensL">${n ? S.lista.map(i => `<div class="prod" style="grid-template-columns:1fr auto 34px">
        <div><div class="nome">${esc(i.desc)}</div><div class="meta">${esc(i.lab || '')} · Cód. ${esc(i.cod || '—')}</div></div>
        <div class="preco"><div class="nf">${brl(i.nf)}</div>${i.ref ? `<div class="era">era<s>${brl(i.ref)}</s></div>` : ''}</div>
        <button class="rm" data-act="rm" data-ean="${esc(i.ean)}" title="Remover">${IC.x}</button></div>`).join('')
        : `<div class="vazio"><b>Lista vazia</b>Marque ${IC.check.replace('<svg', '<svg width="14" height="14" style="vertical-align:-2px"')} nos produtos das ofertas, da busca ou dos vigiados.</div>`}</div>
    </div>
    <div class="card">
      <div class="sec-t">Mensagem${S.textoEditado ? '<button class="lnk" data-act="regerar">Refazer texto</button>' : '<small>pode editar à vontade</small>'}</div>
      <div class="campo"><label>Frase de abertura</label><input id="intro" value="${esc(S.intro)}"></div>
      <div class="campo" style="padding-top:0"><label>Texto para o WhatsApp</label><textarea id="txt">${esc(S.texto)}</textarea></div>
      <div class="acoes">
        <button class="btn btn-g" data-act="copiar" ${n ? '' : 'disabled'}>${IC.copy} Copiar</button>
        <button class="btn btn-w" data-act="whats" ${n ? '' : 'disabled'}>${IC.lista} Enviar no WhatsApp</button>
      </div>
    </div>
  </div>
  <div class="sp"></div>
  <div class="card"><div class="sec-t">Listas enviadas</div><div id="hist"><div class="carregando">Carregando…</div></div></div>`;
  $('#intro').oninput = e => { S.intro = e.target.value; ls.set('intro', S.intro); if (!S.textoEditado) { S.texto = gerarTexto(); $('#txt').value = S.texto; } };
  $('#txt').oninput = e => { S.texto = e.target.value; if (!S.textoEditado) { S.textoEditado = true; $('.sec-t .lnk:not(.red)') || vListaCabecalho(); } };
  carregarHistorico();
}
function vListaCabecalho() {
  const h = document.querySelectorAll('.grid2 .sec-t')[1];
  if (h) h.innerHTML = 'Mensagem<button class="lnk" data-act="regerar">Refazer texto</button>';
}

async function carregarHistorico() {
  const r = await tentar(() => S.api.selecionar('listas', 'criado_em desc', 30));
  S.historico = r || [];
  const el = $('#hist'); if (!el) return;
  el.innerHTML = S.historico.length ? S.historico.map((h, k) => {
    const dt = new Date(h.criado_em);
    const nomes = (h.itens || []).map(i => i.desc).join(', ');
    return `<div class="hist"><div><b>${dt.toLocaleDateString('pt-BR')} ${dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</b> · ${h.qtd} ${h.qtd === 1 ? 'item' : 'itens'}
      <div class="q">${esc(nomes)}</div></div>
      <div class="bt"><button class="lnk" data-act="hcopiar" data-k="${k}">Copiar</button><button class="lnk" data-act="hreusar" data-k="${k}">Reusar</button></div></div>`;
  }).join('') : '<div class="vazio">Nenhuma lista enviada ainda.</div>';
}

let ultimoSalvo = '';
async function salvarNoHistorico(texto) {
  if (texto === ultimoSalvo) return;
  ultimoSalvo = texto;
  await tentar(async () => {
    await S.api.inserir('listas', [{ data_ref: S.painel?.data || null, qtd: S.lista.length, texto,
      itens: S.lista.map(i => ({ ean: i.ean, cod: i.cod, desc: i.desc, lab: i.lab, nf: i.nf, ref: i.ref, eco: i.eco, ofim: i.ofim })) }]);
    carregarHistorico();
  });
}
async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); }
  catch { const t = document.createElement('textarea'); t.value = texto; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
}

/* ---------- Tela: Importar ---------- */
function vImportar() {
  $('#main').innerHTML = `<div class="h1">Importar planilhas</div>
    ${ehCel() ? '<div class="aviso" style="margin:0 0 12px">A importação foi pensada para o computador, mas funciona aqui também.</div>' : ''}
    <label class="drop" id="drop">${IC.up}<b>Arraste as planilhas aqui ou clique para escolher</b>
      <span class="muted">Exportação da aba "Lista de Produtos" do pedido eletrônico (.xlsx). Pode escolher várias de dias diferentes.</span>
      <input type="file" id="arq" accept=".xlsx,.xls" multiple hidden></label>
    <div id="fila"></div>
    <div class="sp"></div>
    <div class="card"><div class="sec-t">Dias já importados <small id="nDias"></small></div><div id="dias"><div class="carregando">Carregando…</div></div></div>`;
  const drop = $('#drop');
  $('#arq').onchange = e => { adicionarArquivos([...e.target.files]); e.target.value = ''; };
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => adicionarArquivos([...e.dataTransfer.files]));
  desenharFila(); carregarDias();
}

let xlsxPronto;
function carregarXLSX() {
  if (window.XLSX) return Promise.resolve();
  return xlsxPronto ||= new Promise((ok, erro) => {
    const s = document.createElement('script'); s.src = XLSX_SRC; s.onload = ok;
    s.onerror = () => { xlsxPronto = null; erro(new Error('Não consegui carregar o leitor de Excel. Verifique a internet.')); };
    document.head.appendChild(s);
  });
}

async function adicionarArquivos(files) {
  files = files.filter(f => /\.xlsx?$/i.test(f.name));
  if (!files.length) return toast('Escolha arquivos .xlsx');
  try { await carregarXLSX(); } catch (e) { return toast(e.message, 5000); }
  for (const f of files) {
    const item = { id: Math.random().toString(36).slice(2), nome: f.name, status: 'lendo', prog: 0 };
    S.fila.push(item); desenharFila();
    try {
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      item.r = Planilha.ler(wb, f.name, f.lastModified);
      item.data = item.r.data; item.status = 'pronto';
    } catch (e) { item.status = 'erro'; item.erro = e.message; }
    desenharFila();
  }
}

function desenharFila() {
  const el = $('#fila'); if (!el) return;
  if (!S.fila.length) return el.innerHTML = '';
  const datas = new Set((S.dias || []).map(d => d.data));
  const ultimaFarm = S.painel?.farmacia;
  const prontos = S.fila.filter(i => i.status === 'pronto').length;
  el.innerHTML = `<div class="sp"></div><div class="card"><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Arquivo</th><th>Data dos preços</th><th>Cliente</th><th>Itens</th><th>Situação</th><th></th></tr></thead><tbody>
    ${S.fila.map(i => {
      const av = [];
      if (i.status === 'pronto') {
        if (i.r.origemData !== 'arquivo') av.push('Confira a data');
        if (datas.has(i.data)) av.push('Já importado: será substituído');
        if (ultimaFarm && i.r.farmacia && i.r.farmacia !== ultimaFarm) av.push('Cliente diferente da última planilha');
      }
      const st = { lendo: 'Lendo…', pronto: 'Pronto', erro: `<span class="st-err">${esc(i.erro || 'Erro')}</span>`, enviando: `<div class="prog"><i style="width:${Math.round(i.prog * 100)}%"></i></div>`, ok: '<span class="st-ok">Importado ✓</span>' }[i.status];
      return `<tr><td>${esc(i.nome)}</td>
        <td>${i.r ? `<input type="date" value="${i.data}" data-fila="${i.id}" ${i.status === 'pronto' ? '' : 'disabled'}>` : '—'}</td>
        <td>${esc(i.r?.farmacia || '—')}</td><td>${i.r ? i.r.produtos.length.toLocaleString('pt-BR') : '—'}</td>
        <td>${st}${av.length ? `<div class="st-w">${av.join(' · ')}</div>` : ''}</td>
        <td>${i.status !== 'enviando' ? `<button class="rm" data-act="tirarFila" data-id="${i.id}" title="Tirar">${IC.x}</button>` : ''}</td></tr>`;
    }).join('')}</tbody></table></div>
    <div class="acoes" style="padding-top:16px"><button class="btn btn-p" data-act="importar" ${prontos && !S.importando ? '' : 'disabled'}>${S.importando ? 'Importando…' : `Importar ${prontos} ${prontos === 1 ? 'planilha' : 'planilhas'}`}</button></div></div>`;
  el.querySelectorAll('input[data-fila]').forEach(inp => inp.onchange = e => {
    const it = S.fila.find(x => x.id === e.target.dataset.fila);
    if (it && e.target.value) { it.data = e.target.value; it.r.origemData = 'arquivo'; desenharFila(); }
  });
}

async function importarFila() {
  const prontos = S.fila.filter(i => i.status === 'pronto').sort((a, b) => a.data.localeCompare(b.data));
  if (!prontos.length || S.importando) return;
  const repetidas = prontos.map(i => i.data).filter((d, k, a) => a.indexOf(d) !== k);
  if (repetidas.length) return toast('Duas planilhas com a mesma data (' + dBR(repetidas[0], true) + '). Ajuste a data.', 5000);
  S.importando = true;
  let maxData = S.painel?.data || '0000';
  for (const it of prontos) {
    it.status = 'enviando'; it.prog = 0; desenharFila();
    try {
      const maisRecente = it.data >= maxData;
      await Importador.importar(S.api, { ...it.r, data: it.data }, { maisRecente, progresso: p => { it.prog = p; const bar = document.querySelector(`input[data-fila="${it.id}"]`)?.closest('tr')?.querySelector('.prog i'); if (bar) bar.style.width = Math.round(p * 100) + '%'; } });
      if (maisRecente) maxData = it.data;
      it.status = 'ok';
    } catch (e) { it.status = 'erro'; it.erro = e.message; }
    desenharFila();
  }
  S.importando = false; desenharFila();
  await carregarPainel(); carregarDias();
  const ok = prontos.filter(i => i.status === 'ok').length;
  if (ok) {
    toast(`${ok} ${ok === 1 ? 'planilha importada' : 'planilhas importadas'}. Veja as ofertas!`, 3500);
    setTimeout(() => { S.fila = S.fila.filter(i => i.status !== 'ok'); if (S.aba === 'importar' && !S.fila.length) ir('hoje'); }, 1400);
  }
}

async function carregarDias() {
  const r = await tentar(() => S.api.rpc('listar_importacoes'));
  S.dias = r || [];
  const el = $('#dias'); if (!el) return;
  $('#nDias').textContent = S.dias.length ? `${S.dias.length} ${S.dias.length === 1 ? 'dia' : 'dias'}` : '';
  el.innerHTML = S.dias.length ? `<div class="tbl-wrap"><table class="tbl"><tbody>${S.dias.map(d => `<tr>
    <td><b>${dBR(d.data, true)}</b></td><td class="muted">${esc(d.farmacia || '')}</td><td class="muted">${(d.itens || 0).toLocaleString('pt-BR')} itens</td>
    <td style="text-align:right"><button class="lnk red" data-act="exDia" data-d="${d.data}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`
    : '<div class="vazio">Nenhum dia importado ainda.</div>';
  desenharFila();
}

/* ---------- Cliques ---------- */
async function onClick(e) {
  const go = e.target.closest('[data-go]');
  if (go) { $('#menu')?.classList.add('hide'); return ir(go.dataset.go); }
  const tp = e.target.closest('[data-tipo]');
  if (tp) { S.tipo = tp.dataset.tipo; S.limite = 300; document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b === tp)); return carregarItens(); }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const ean = a.dataset.ean || a.closest('[data-ean]')?.dataset.ean;
  switch (a.dataset.act) {
    case 'sel': return alternarLista(ean);
    case 'add': return alternarLista(ean, true);
    case 'vig': return alternarVigia(ean);
    case 'mais': S.limite += 300; return carregarItens();
    case 'rm': S.lista = S.lista.filter(x => x.ean !== ean); ls.set('lista', S.lista); S.textoEditado = false; navs(); return vLista();
    case 'limpar': if (confirm('Tirar todos os itens da lista?')) { S.lista = []; ls.set('lista', []); S.textoEditado = false; navs(); vLista(); } return;
    case 'regerar': S.textoEditado = false; S.texto = null; return vLista();
    case 'copiar': { const t = $('#txt').value; await copiar(t); toast('Texto copiado'); return salvarNoHistorico(t); }
    case 'whats': { const t = $('#txt').value; await salvarNoHistorico(t); return window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank'); }
    case 'hcopiar': { const h = S.historico[+a.dataset.k]; await copiar(h.texto); return toast('Texto copiado'); }
    case 'hreusar': {
      const h = S.historico[+a.dataset.k];
      S.lista = (h.itens || []).map(i => ({ ...i })); ls.set('lista', S.lista); S.textoEditado = false; S.texto = null;
      toast('Itens carregados. Os preços são os daquele dia.'); navs(); return vLista();
    }
    case 'tirarFila': S.fila = S.fila.filter(x => x.id !== a.dataset.id); return desenharFila();
    case 'importar': return importarFila();
    case 'exDia': {
      if (!confirm(`Excluir os preços de ${dBR(a.dataset.d, true)}?`)) return;
      await tentar(() => S.api.rpc('excluir_importacao', { p_data: a.dataset.d }));
      toast('Dia excluído'); await carregarPainel(); return carregarDias();
    }
  }
}

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
iniciar();
</script>
